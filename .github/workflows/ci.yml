name: PocketCloud CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  runtime-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked runtime
        run: python -m pip install -r requirements.lock
      - name: Run runtime tests and static checks
        run: |
          PYTHONPATH=runtime python -m unittest discover -s tests -v
          PYTHONPATH=runtime python -m compileall -q runtime tests scripts/testing/soak_runtime.py scripts/testing/target_preflight.py
          python -m pip check
          bash -n scripts/termux/run.sh scripts/termux/supervisor.sh scripts/testing/run_android_emulator_tests.sh

  termux-wheel-resolution:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Resolve only binary Android arm64 CPython 3.12 wheels
        run: |
          python -m pip download \
            --dest "$RUNNER_TEMP/termux-wheelhouse" \
            --requirement requirements-termux.lock \
            --platform android_24_arm64_v8a \
            --python-version 312 \
            --implementation cp \
            --abi cp312 \
            --only-binary=:all:
      - name: Print wheel set
        run: find "$RUNNER_TEMP/termux-wheelhouse" -maxdepth 1 -type f -printf '%f\n' | sort

  android-supervisor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Accept Android SDK licenses and install API 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Run Android unit tests and assemble debug APK
        working-directory: android-supervisor
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pocketcloud-supervisor-debug-apk
          path: android-supervisor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-emulator:
    name: Android AVD API ${{ matrix.api-level }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Install Android Emulator host runtime library
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libpulse0
      - name: Install Android Emulator, API 36 build tools, and selected system image
        env:
          API_LEVEL: ${{ matrix.api-level }}
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            "emulator" "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
            "system-images;android-${API_LEVEL};google_apis;x86_64"
      - name: Enable KVM access for the hosted runner
        run: |
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run connected Android instrumentation tests
        env:
          POCKETCLOUD_AVD_API_LEVEL: ${{ matrix.api-level }}
        run: bash scripts/testing/run_android_emulator_tests.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pocketcloud-avd-api-${{ matrix.api-level }}-reports
          path: |
            android-supervisor/app/build/reports/androidTests/connected/**
            android-supervisor/app/build/outputs/androidTest-results/connected/**
            ${{ runner.temp }}/pocketcloud-emulator-api${{ matrix.api-level }}.log
          if-no-files-found: warn

  pairing-host-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install laptop pairing-host dependencies
        run: python -m pip install -r requirements-pairing.lock
      - name: Run pairing-host tests
        run: python -m unittest discover -s pairing_host/tests -v

  pairing-host-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run portable Android preflight tests
        run: python -m unittest discover -s tests -p 'test_target_preflight.py' -v
      - name: Install laptop pairing-host dependencies
        run: python -m pip install -r requirements-pairing.lock
      - name: Run pairing-host tests
        run: python -m unittest discover -s pairing_host/tests -v
