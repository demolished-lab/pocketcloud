[project]
name = "pocketcloud-runtime"
version = "0.2.0"
description = "Rootless local runtime foundation for PocketCloud"
requires-python = ">=3.11"
dependencies = [
  "starlette==1.10.0",
  "uvicorn==0.54.0",
  "SQLAlchemy==2.1.6",
]

[tool.pocketcloud]
# requirements.lock is the Linux host lock; requirements-termux.lock was separately
# resolved using Android arm64 CPython wheel tags. Target-device execution remains open.
